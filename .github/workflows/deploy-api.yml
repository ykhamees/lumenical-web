name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths: ["api/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lumenical-api-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: api
        run: uv sync

      - name: Lint
        working-directory: api
        run: uv run ruff check .

      - name: Type check
        working-directory: api
        run: uv run mypy app

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node (Firebase CLI)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # conftest.py invokes the bare `firebase` binary directly (not `npx
      # firebase-tools`) — nothing else in this job puts it on PATH. Without
      # this, Popen's shell=True swallows the "command not found" (its
      # stdout/stderr are piped, not surfaced anywhere), so every test just
      # timed out waiting for a port that nothing was ever going to open —
      # the real cause of every prior run's "did not start in time" failure,
      # not an actual startup-speed problem.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # firebase-tools downloads the emulator JARs on first use — without
      # this, every run on a fresh runner re-downloads them, which is what
      # made api/'s first-ever CI run here exceed conftest.py's wait timeout.
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Run tests (against the real Firestore emulator)
        working-directory: api
        run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/653525125040/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: lumenical-api-deployer@lumenical-web.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker me-central1-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: api
        run: |
          docker build -t me-central1-docker.pkg.dev/lumenical-web/lumenical-api/api:${{ github.sha }} .
          docker push me-central1-docker.pkg.dev/lumenical-web/lumenical-api/api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lumenical-api \
            --image=me-central1-docker.pkg.dev/lumenical-web/lumenical-api/api:${{ github.sha }} \
            --region=me-central1 \
            --project=lumenical-web \
            --quiet
